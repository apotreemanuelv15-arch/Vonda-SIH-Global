{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    /* Style Cyberpunk / Interface Holographique Avancée */
    .hologram-viewport {
        background: radial-gradient(circle at center, #0b1329 0%, #030712 100%);
        color: #38bdf8;
        border-radius: 24px;
        padding: 40px;
        border: 2px solid #0284c7;
        box-shadow: 0 0 40px rgba(2, 132, 199, 0.25);
        position: relative;
        overflow: hidden;
    }

    /* Sphère Holographique 3D Animée */
    .hologram-sphere {
        width: 180px;
        height: 180px;
        border-radius: 50%;
        background: transparent;
        border: 2px dashed #38bdf8;
        position: relative;
        box-shadow: 0 0 40px rgba(56, 189, 248, 0.4), inset 0 0 40px rgba(56, 189, 248, 0.2);
        animation: rotateSphere 10s linear infinite;
        transition: transform 0.05s ease, box-shadow 0.05s ease, border-color 0.3s ease;
    }

    .hologram-sphere::before, .hologram-sphere::after {
        content: '';
        position: absolute;
        top: -4px; left: -4px; right: -4px; bottom: -4px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-left-color: #f59e0b;
        border-right-color: #10b981;
        animation: rotateReverse 4s linear infinite;
        opacity: 0.6;
    }

    /* Égaliseur Audio (Ondes de choc) */
    .audio-wave {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 4px;
        height: 30px;
        opacity: 0;
        transition: opacity 0.3s ease;
    }
    .audio-bar {
        width: 4px;
        height: 5px;
        background-color: #38bdf8;
        border-radius: 2px;
        transition: height 0.05s ease;
    }
    .listening .audio-bar {
        animation: pulseBar 0.8s ease infinite alternate;
    }
    .speaking .audio-bar {
        background-color: #10b981;
        animation: pulseBar 0.5s ease infinite alternate;
    }

    /* Animations */
    @keyframes rotateSphere { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes rotateReverse { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
    @keyframes pulseBar { 0% { height: 5px; } 100% { height: 25px; } }
</style>

<div class="container text-center my-5 hologram-viewport">
    
    <h1 class="mb-2 text-white" style="font-weight: 800; letter-spacing: 1px;">
        Vonda SIH — Hologramme Vocal IA
    </h1>
    <p class="text-secondary mb-5">Système d'analyse visuelle et de topographie des stocks en temps réel</p>

    <div class="d-flex justify-content-center align-items-center mb-4" style="min-height: 220px;">
        <div id="hologram-core" class="hologram-sphere d-flex justify-content-center align-items-center">
            <div id="audio-wave-container" class="audio-wave">
                <div class="audio-bar" style="animation-delay: 0.1s"></div>
                <div class="audio-bar" style="animation-delay: 0.3s"></div>
                <div class="audio-bar" style="animation-delay: 0.5s"></div>
                <div class="audio-bar" style="animation-delay: 0.2s"></div>
                <div class="audio-bar" style="animation-delay: 0.4s"></div>
            </div>
        </div>
    </div>

    <div class="p-3 mb-4 text-start" style="background: rgba(30, 41, 59, 0.7); border-radius: 12px; min-height: 90px; border-left: 5px solid #0284c7;">
        <div id="statut-ia" class="fw-bold text-muted" style="font-size: 0.9rem;">🤖 ACCÈS SÉCURISÉ — PRÊT</div>
        <p id="reponse-ia-texte" class="mt-2 text-white fw-bold mb-0" style="font-size: 1.2rem; min-height: 30px;"></p>
    </div>

    <div class="row justify-content-center g-3">
        <div class="col-md-5">
            <button id="btn-parler" class="btn btn-lg btn-info w-100 fw-bold text-uppercase py-3">
                🎙️ Activer le Micro Vocals
            </button>
        </div>
        <div class="col-md-5">
            <button id="btn-camera" class="btn btn-lg btn-dark style-base w-100 fw-bold text-uppercase py-3" style="border: 1px solid #475569;">
                📷 Scanner une Ordonnance
            </button>
        </div>
    </div>
</div>

<script>
    const btnParler = document.getElementById('btn-parler');
    const btnCamera = document.getElementById('btn-camera');
    const statutIA = document.getElementById('statut-ia');
    const reponseTexte = document.getElementById('reponse-ia-texte');
    const hologramCore = document.getElementById('hologram-core');
    const waveContainer = document.getElementById('audio-wave-container');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let audioCtx = null;
    let analyser = null;
    let dataArray = null;
    let source = null;
    let enEcoute = false;
    let enReponseVocale = false;

    // Initialisation de l'analyseur audio pour l'animation physique de la sphère
    function initAudioAnalyser(stream) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        source = audioCtx.createMediaStreamSource(stream);
        source.connect(analyser);
        analyser.fftSize = 32;
        const bufferLength = analyser.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);
        
        function animer() {
            requestAnimationFrame(animer);
            if (enEcoute || enReponseVocale) {
                analyser.getByteFrequencyData(dataArray);
                let total = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    total += dataArray[i];
                }
                let niveauVolume = total / dataArray.length;
                let scale = 1 + (niveauVolume / 120);
                
                if (enEcoute) {
                    hologramCore.style.transform = `scale(${scale})`;
                    hologramCore.style.boxShadow = `0 0 ${40 + niveauVolume}px #f59e0b, inset 0 0 20px #f59e0b`;
                } else if (enReponseVocale) {
                    hologramCore.style.transform = `scale(${scale})`;
                    hologramCore.style.boxShadow = `0 0 ${40 + niveauVolume}px #10b981, inset 0 0 20px #10b981`;
                }
            }
        }
        animer();
    }

    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ audio: true })
        .then(stream => { initAudioAnalyser(stream); })
        .catch(err => { console.log("Microphone non lié ou bloqué."); });
    }

    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.continuous = true; 
        recognition.interimResults = true; // Permet de voir les mots en cours de dictée sur le mobile
        recognition.lang = 'fr-FR';

        btnParler.addEventListener('click', () => {
            if (window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
            }

            if (!enEcoute) {
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                enEcoute = true;
                enReponseVocale = false;

                hologramCore.style.borderColor = "#f59e0b";
                waveContainer.className = "audio-wave listening";
                waveContainer.style.opacity = "1";
                
                statutIA.innerText = "👂 ÉCOUTE MOBILE ACTIVE (Parlez maintenant)...";
                reponseTexte.innerText = "En attente de vos mots...";
                
                recognition.start();
                btnParler.innerText = "🛑 Analyser immédiatement";
                btnParler.classList.replace('btn-info', 'btn-danger');
            } else {
                recognition.stop();
            }
        });

        // Capture et affichage du texte en temps réel pendant que vous parlez
        recognition.onletter = function(event) {
            let interimTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (!event.results[i].isFinal) {
                    interimTranscript += event.results[i][0].transcript;
                }
            }
            if(interimTranscript) {
                reponseTexte.innerText = `[Capté : ${interimTranscript}...]`;
            }
        };

        recognition.onresult = function(event) {
            const indexDernier = event.results.length - 1;
            const texteUtilisateur = event.results[indexDernier][0].transcript.trim();
            
            if (texteUtilisateur === "") {
                statutIA.innerText = "⚠️ Aucun mot distinct détecté.";
                reinitialiserInterface();
                return;
            }

            enEcoute = false;
            statutIA.innerText = `🧠 RADAR CENTRAL — RECHERCHE : "${texteUtilisateur}"`;
            reponseTexte.innerText = "Analyse de la base de données...";
            hologramCore.style.boxShadow = "0 0 60px #10b981, inset 0 0 30px #10b981";
            hologramCore.style.borderColor = "#10b981";
            waveContainer.className = "audio-wave speaking";

            fetch(`/api/radar-ia/?medicament=${encodeURIComponent(texteUtilisateur)}`)
                .then(response => response.json())
                .then(data => {
                    statutIA.innerText = "🔊 TRANSMISSION INTERFACE VOCALE :";
                    let messageVocal = "";

                    if (data.disponibilites_immédiates && data.disponibilites_immédiates.length > 0) {
                        let local = data.disponibilites_immédiates[0];
                        messageVocal = `Le produit ${data.produit_recherche} est disponible immédiatement à ${local.pharmacie}. Stock : ${local.stock_cartons} cartons.`;
                    } else if (data.radar_arrivages_previsionnels && data.radar_arrivages_previsionnels.length > 0) {
                        let arrivage = data.radar_arrivages_previsionnels[0];
                        messageVocal = `Alerte rupture pour ${data.produit_recherche}. Logistique d'arrivage : Lot ${arrivage.numero_lot} en transit pour le dépôt de ${arrivage.depot_destination}.`;
                    } else {
                        messageVocal = `Le produit ${texteUtilisateur} n'est pas répertorié dans les stocks actuels.`;
                    }

                    reponseTexte.innerText = messageVocal;
                    
                    enReponseVocale = true;
                    const voix = new SpeechSynthesisUtterance(messageVocal);
                    voix.lang = 'fr-FR';
                    
                    voix.onend = function() {
                        enReponseVocale = false;
                        reinitialiserInterface();
                    };

                    window.speechSynthesis.speak(voix);
                })
                .catch(error => {
                    statutIA.innerText = "❌ ERREUR DE CONNEXION API CENTRAL";
                    reponseTexte.innerText = "La liaison avec le serveur a échoué.";
                    reinitialiserInterface();
                });
        };

        recognition.onerror = function() { reinitialiserInterface(); };
        recognition.onend = function() { if (!enReponseVocale) reinitialiserInterface(); };

        function reinitialiserInterface() {
            enEcoute = false;
            btnParler.innerText = "🎙️ Activer le Micro Vocals";
            btnParler.classList.replace('btn-danger', 'btn-info');
            hologramCore.style.transform = "scale(1)";
            hologramCore.style.boxShadow = "0 0 40px rgba(2, 132, 199, 0.4), inset 0 0 40px rgba(2, 132, 199, 0.2)";
            hologramCore.style.borderColor = "#38bdf8";
            waveContainer.style.opacity = "0";
            waveContainer.className = "audio-wave";
        }
    } else {
        statutIA.innerText = "❌ RECONNAISSANCE VOCALE NON SUPPORTÉE.";
    }

    // Gestion native du capteur optique (Caméra)
    btnCamera.addEventListener('click', () => {
        statutIA.innerText = "📷 INITIALISATION DU CAPTEUR VISUEL OPTIQUE...";
        const inputCamera = document.createElement('input');
        inputCamera.type = 'file';
        inputCamera.accept = 'image/*';
        inputCamera.capture = 'environment';
        inputCamera.click();

        inputCamera.onchange = function(event) {
            const fichier = event.target.files[0];
            if (fichier) {
                statutIA.innerText = "🔄 NUMÉRISATION ET EXTRACTION OCR DE L'ORDONNANCE...";
                hologramCore.style.boxShadow = "0 0 60px #a855f7, inset 0 0 30px #a855f7";
                hologramCore.style.borderColor = "#a855f7";
                
                setTimeout(() => {
                    statutIA.innerText = "📄 ANALYSE TERMINÉE AVEC SUCCÈS";
                    reponseTexte.innerText = "Ordonnance stockée dans le cloud sécurisé. Molécules identifiées et transmises au préparateur.";
                    hologramCore.style.boxShadow = "0 0 40px rgba(2, 132, 199, 0.4)";
                    hologramCore.style.borderColor = "#38bdf8";
                }, 2500);
            }
        };
    });
</script>
{% endblock %}
