{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container text-center my-5" style="background: #0f172a; color: #38bdf8; border-radius: 20px; padding: 40px; border: 2px solid #0284c7; box-shadow: 0 0 30px rgba(2, 132, 199, 0.5);">
    
    <h1 class="mb-4" style="font-weight: 800; text-transform: uppercase; letter-spacing: 2px;">
        Vonda SIH — Hologramme Vocal IA
    </h1>
    <p class="text-slate-400 mb-5">Présentez votre ordonnance à la caméra ou parlez directement à l'assistant virtuel.</p>

    <div class="d-flex justify-content-center align-items-center mb-5">
        <div id="hologram-core" class="rounded-circle d-flex justify-content-center align-items-center" style="width: 200px; height: 200px; background: radial-gradient(circle, #0284c7 0%, #0f172a 70%); border: 4px solid #38bdf8; box-shadow: 0 0 50px #0284c7; transition: all 0.3s ease;">
            <div id="wave-pulse" class="spinner-grow text-info" role="status" style="width: 120px; height: 120px; animation-duration: 2s; opacity: 0.6;"></div>
        </div>
    </div>

    <div class="p-3 mb-4 style-base" style="background: #1e293b; border-radius: 10px; min-height: 80px; border-left: 5px solid #38bdf8;">
        <h4 id="statut-ia" style="font-size: 1.1rem; color: #94a3b8;" class="text-start m-0">🤖 En attente de votre voix...</h4>
        <p id="reponse-ia-texte" class="text-start mt-2 text-white fw-bold" style="font-size: 1.3rem;"></p>
    </div>

    <div class="row justify-content-center g-3">
        <div class="col-md-4">
            <button id="btn-parler" class="btn btn-lg btn-info w-100 fw-bold text-uppercase py-3" style="box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);">
                🎙️ Parler à l'Assistant
            </button>
        </div>
        <div class="col-md-4">
            <button id="btn-camera" class="btn btn-lg btn-dark w-100 fw-bold text-uppercase py-3" style="border: 1px solid #64748b;">
                📷 Scanner Ordonnance
            </button>
        </div>
    </div>

</div>

<script>
    const btnParler = document.getElementById('btn-parler');
    const statutIA = document.getElementById('statut-ia');
    const reponseTexte = document.getElementById('reponse-ia-texte');
    const hologramCore = document.getElementById('hologram-core');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;

        btnParler.addEventListener('click', () => {
            hologramCore.style.boxShadow = "0 0 60px #f59e0b";
            hologramCore.style.borderColor = "#f59e0b";
            statutIA.innerText = "👂 Écoute active... Dites le nom d'un médicament (ex: Paracétamol, Pénicilline)";
            reponseTexte.innerText = "";
            recognition.start();
        });

        recognition.onresult = function(event) {
            const texteUtilisateur = event.results[0][0].transcript;
            statutIA.innerText = `🧠 Analyse radar pour : "${texteUtilisateur}"...`;
            hologramCore.style.boxShadow = "0 0 70px #10b981";
            hologramCore.style.borderColor = "#10b981";

            // RECHERCHE EN DIRECT VIA L'API RADAR DJANGO
            fetch(`/pharmacy/api/radar-ia/?medicament=${encodeURIComponent(texteUtilisateur)}`)
                .then(response => response.json())
                .then(data => {
                    statutIA.innerText = "🔊 Synthèse vocale de l'Hologramme :";
                    let messageVocal = "";

                    if (data.disponibilites_immédiates && data.disponibilites_immédiates.length > 0) {
                        let local = data.disponibilites_immédiates[0];
                        messageVocal = `Le produit ${data.produit_recherche} est disponible immédiatement à ${local.pharmacie}. Le stock est de ${local.stock_cartons} cartons.`;
                    } else if (data.radar_arrivages_previsionnels && data.radar_arrivages_previsionnels.length > 0) {
                        let arrivage = data.radar_arrivages_previsionnels[0];
                        messageVocal = `Le produit est en rupture physique. Cependant, notre système a détecté le lot d'importation ${arrivage.numero_lot} en cours de transit douanier pour le dépôt de ${arrivage.depot_destination}.`;
                    } else {
                        messageVocal = `Je n'ai trouvé aucun stock ni aucun arrivage pour le produit ${texteUtilisateur} dans notre réseau de distribution.`;
                    }

                    reponseTexte.innerText = messageVocal;
                    
                    // Lecture de la réponse à voix haute
                    const voix = new SpeechSynthesisUtterance(messageVocal);
                    window.speechSynthesis.speak(voix);
                    
                    hologramCore.style.boxShadow = "0 0 50px #0284c7";
                    hologramCore.style.borderColor = "#38bdf8";
                })
                .catch(error => {
                    statutIA.innerText = "❌ Erreur de liaison.";
                    reponseTexte.innerText = "Le hub central Vonda SIH n'a pas répondu.";
                    hologramCore.style.boxShadow = "0 0 50px #ef4444";
                    hologramCore.style.borderColor = "#ef4444";
                });
        };

    } else {
        statutIA.innerText = "❌ Matériel vocal non supporté par ce navigateur.";
    }
</script>
{% endblock %}
